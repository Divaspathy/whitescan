[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whitescan"
version = "3.1.6"
description = "ARP discovery + nmap + optional OpenVAS (GVM) network assessment toolkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Divaspathy" },
]
keywords = [
  "nmap",
  "openvas",
  "gvm",
  "network",
  "security",
  "scanner",
  "vulnerability",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
openvas = ["python-gvm>=23.4.0"]
dev = [
  "python-gvm>=23.4.0",
]

[project.urls]
Homepage = "https://github.com/Divaspathy/whitescan"
Repository = "https://github.com/Divaspathy/whitescan"
Issues = "https://github.com/Divaspathy/whitescan/issues"

[project.scripts]
whitescan = "whitescan.__main__:entry"

[tool.setuptools.packages.find]
include = ["whitescan*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
whitescan = ["py.typed"]
